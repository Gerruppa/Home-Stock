# What `flet build apk` packs into the Android app, run from this folder: the repo's src/, with only the dependencies
# the phone needs. The app's own pyproject.toml stays the one for development.
[project]
name = "home-stock"
# scripts/release.py builds with --build-version from __version__; this one only counts for builds by hand
version = "0.4.0"
description = "Home Stock for Android"
requires-python = ">=3.14"
dependencies = [
    "flet>=1.0.5",
    # The newest SQLAlchemy with an Android wheel on pypi.flet.dev
    "sqlalchemy==2.0.50",
    "alembic>=1.20",
    "platformdirs>=4.12",
]

[tool.flet]
product = "Home Stock"
org = "pl.gerruppa"

[tool.flet.app]
path = "../src"
module = "android_main"

# Alembic finds the migrations by their .py files, which the default .pyc compilation removes
[tool.flet.compile]
app = false
