name: CI

# Pre-commit runs ruff and mypy but not the tests, so every PR and every push to main runs the full suite here.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    # The app is Windows-only (pywebview), so the checks run where it runs.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      # A hung test fails with its stack trace instead of running into the job timeout.
      - run: python -m pytest -n auto --timeout=300
