[project]
name = "home-stock"
dynamic = ["version"]
description = "Home Stock: an Android app for household stock"
requires-python = ">=3.14"
dependencies = [
    "flet>=1.0.5",
    # 2.0.50 is the newest SQLAlchemy with an Android wheel (android/pyproject.toml)
    "sqlalchemy>=2.0.50",
    "alembic>=1.20",
    "platformdirs>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-xdist>=3.8",
    "pytest-timeout>=2.4",
    "pre-commit>=4.7",
    "mypy>=2.4",
    "ruff>=0.16",
    # flet run, the home-stock-android preview and flet build apk
    "flet[all]>=1.0.5",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "home_stock.__version__" }

[tool.setuptools.package-data]
home_stock = ["sources/changelog.md", "persistence/migrations/*.py", "persistence/migrations/*.mako", "persistence/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
strict = true

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
