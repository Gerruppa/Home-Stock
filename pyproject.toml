[project]
name = "home-stock"
dynamic = ["version"]
description = "Home Stock: desktop app"
requires-python = ">=3.14"
dependencies = [
    "nicegui>=3.18",
    "pywebview>=6.2",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "platformdirs>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-xdist>=3.8",
    "pytest-timeout>=2.4",
    "pre-commit>=4.7",
    "mypy>=2.4",
    "ruff>=0.16",
]

[project.scripts]
home-stock = "home_stock.app:main"

# No console window: this is what the desktop shortcut starts.
[project.gui-scripts]
home-stock-gui = "home_stock.app:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "home_stock.__version__" }

[tool.setuptools.package-data]
home_stock = ["ui/changelog.md", "persistence/migrations/*.py", "persistence/migrations/*.mako", "persistence/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["ui: drives the UI through NiceGUI's user_simulation"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["webview.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
